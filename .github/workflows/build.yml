name: Build APK
on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y libncurses-dev libncursesw5-dev git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libssl-dev
        pip install buildozer

    - name: Build APK
      run: |
        buildozer android debug
